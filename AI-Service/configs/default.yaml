# Biometric-Pet-Identification default config (synthetic-sanity profile).
# Real-training profile: set backbone to a timm model + head: magface (see comments).

img_size: 64
channels: 3
embed_dim: 128

# backbone: small_cnn        # sanity / CPU
# real options:
#   timm:efficientnet_b0     # face branch baseline
#   timm:tiny_vit_5m_224     # nose branch (DNNetV2-style, the 99.8% recipe)
#   timm:resnest50d          # Nose-to-ID embedder
backbone: small_cnn

# head: arcface (baseline) -> magface (the selected upgrade)
head: arcface
arc_margin: 0.5
arc_scale: 30.0
mag_l_margin: 0.45
mag_u_margin: 0.8
mag_l_a: 10.0
mag_u_a: 110.0
mag_lambda_g: 20.0

epochs: 8
batch_size: 64
lr: 0.001
weight_decay: 0.0001
amp: true            # auto-disabled on CPU
device: auto

rank_ks: [1, 5]
target_fmr: 0.01     # open-set false-match-rate ceiling (safety-first)
abstain_band: 0.05
seed: 1337

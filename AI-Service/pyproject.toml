[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petsy"
version = "0.2.0"
description = "Smartphone biometric pet identification & lost-pet reunion (dog nose-print + face)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["computer-vision", "re-identification", "metric-learning", "pets", "open-set"]

# Core runtime — enough to run the pipeline and the full test suite.
# NOTE: for GPU, install the CUDA build of torch separately (see docs/RUNBOOK.md).
dependencies = [
    "numpy>=1.26",
    "torch>=2.3",
    "torchvision>=0.18",
    "faiss-cpu>=1.8",
    "pillow>=10.3",
    "scikit-learn>=1.4",
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
serve = ["streamlit>=1.36", "uvicorn[standard]>=0.30"]
train = ["timm>=1.0", "ultralytics>=8.2"]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
